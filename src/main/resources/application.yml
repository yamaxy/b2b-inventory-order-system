spring:
  application:
    name: inventory-order-system

  datasource:
    url: jdbc:postgresql://localhost:5432/mini_erp_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # 次タスクのFlyway導入を見越し、自動テーブル生成はオフ
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080