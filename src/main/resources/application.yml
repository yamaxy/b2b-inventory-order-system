spring:
  application:
    name: inventory-order-system

  datasource:
    url: jdbc:postgresql://localhost:5432/mini_erp_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # 次タスクのFlyway導入を見越し、自動テーブル生成はオフ
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Flywayの設定（デフォルトのままでも動くが、安全のために明示）
  flyway:
    enabled: true
    baseline-on-migrate: true

# --- 追加: JWT設定 ---
jwt:
  # HS256アルゴリズム用に256ビット（32バイト）以上のランダムな英数字文字列を指定
  secret: your-super-secret-key-must-be-at-least-32-bytes-long-for-security
  # トークンの有効期限（ミリ秒単位: 86400000 ms = 24時間）
  expiration-ms: 86400000

server:
  port: 8080